
<section class="auth-page">
  <div class="card auth-card border-0 shadow-sm">
    <div class="card-body p-4 p-sm-5">
      <a class="brand" routerLink="/">Rent<span>Hub</span></a>

      <h1 class="h3 mt-4 mb-1">Welcome back!</h1>
      <p class="text-secondary">Login to discover your next home.</p>

      <div class="alert alert-success small py-2" role="note">
        <strong>Demo accounts:</strong><br />
        landlord&#64;renthub.com / Landlord&#64;123<br />
        renter&#64;renthub.com / Renter&#64;123
      </div>

      <form (ngSubmit)="login()" #loginForm="ngForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">Email address</label>
          <input
            id="email"
            type="email"
            name="email"
            class="form-control"
            [class.is-invalid]="emailField.invalid && emailField.touched"
            [(ngModel)]="email"
            required
            email
            #emailField="ngModel"
            placeholder="you@example.com"
          />
          <div class="invalid-feedback">Please enter a valid email address.</div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input
            id="password"
            type="password"
            name="password"
            class="form-control"
            [class.is-invalid]="passwordField.invalid && passwordField.touched"
            [(ngModel)]="password"
            required
            minlength="6"
            #passwordField="ngModel"
            placeholder="Enter your password"
          />
          <div class="invalid-feedback">Password must contain at least 6 characters.</div>
        </div>

        @if (message) {
          <div class="alert alert-danger py-2" role="alert">{{ message }}</div>
        }

        <button class="btn btn-primary w-100 py-2" type="submit" [disabled]="loginForm.invalid">
          Login
        </button>
      </form>

      <p class="text-secondary small mt-4 mb-0">
        New to RentHub?
        <a class="fw-bold" routerLink="/register">Create an account</a>
      </p>
    </div>
  </div>
</section>
